<!DOCTYPE html>
<html>
<head>
    <title>PersonaFlow AI Assistant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .chat-container {
            width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
        }

        .chat-box {
            height: 400px;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user {
            background: #e0e7ff;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #f1f5f9;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .input-area button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #3730a3;
        }

        .back {
            display: block;
            text-align: center;
            margin: 15px;
            text-decoration: none;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <h2>🤖 PersonaFlow AI Assistant</h2>
        <p>Ask about your finance, study and habits</p>
    </div>

    <div class="chat-box">

        {% if message %}
        <div class="message user">
            {{ user_message }}
        </div>

        <div class="message bot">
            {{ message }}
        </div>
        {% else %}
        <div class="message bot">
            Hello! 👋 I am your PersonaFlow Assistant.
            You can ask me about your savings, expenses, study,
            habits or profile.
        </div>
        {% endif %}

    </div>

    <form method="POST" class="input-area">

        <input
            type="text"
            name="message"
            placeholder="Ask something..."
            required
        >

        <button type="submit">Send</button>

    </form>

</div>

<a href="{{ url_for('dashboard') }}" class="back">
    ← Back to Dashboard
</a>

</body>
</html>
